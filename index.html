
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshMart | Business Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10281f; --forest:#14573a; --deep:#0c3b29; --lime:#a6ee6b; --mint:#dff3e3;
  --paper:#f5f7f2; --white:#fff; --muted:#5d7167; --cost:#ef6c00;
  --display:'Fraunces',Georgia,serif; --body:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);padding:14px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}

.top{text-align:center;max-width:1200px;margin:0 auto 10px}
.logo{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
nav.menu{max-width:1200px;margin:0 auto 12px;display:flex;justify-content:center}
nav.menu .group{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;background:var(--white);border-radius:99px;padding:4px;box-shadow:0 0 0 1px #dfe7e0}
nav.menu a{padding:7px 16px;border-radius:99px;font-weight:600;font-size:.9rem;transition:background .2s,color .2s}
nav.menu a:hover,nav.menu a.active{background:var(--forest);color:#fff}

/* hero */
.hero{position:relative;max-width:1200px;margin:0 auto;border-radius:28px;overflow:hidden;min-height:500px;color:#fff;
  background:linear-gradient(180deg,#3f9a5c 0%,#1d6b45 45%,var(--deep) 100%)}
.hero h1{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:var(--display);font-weight:800;
  font-size:clamp(4rem,15.5vw,12.5rem);line-height:.95;letter-spacing:-.04em;color:var(--lime);white-space:nowrap;user-select:none}
.hero h1 span{display:inline-block;transform:translateY(120%);opacity:0;animation:rise .8s cubic-bezier(.2,.9,.25,1) forwards;animation-delay:calc(var(--i)*60ms)}
@keyframes rise{to{transform:none;opacity:1}}
.hero h1 span:hover{transform:translateY(-10px) rotate(-3deg);transition:transform .25s;color:#fff}
.badge{position:absolute;top:20%;left:57%;background:var(--lime);color:var(--deep);font-weight:700;font-size:.8rem;padding:6px 14px;border-radius:99px;
  transform:rotate(-14deg);box-shadow:0 6px 16px rgba(0,0,0,.2);animation:wobble 3s ease-in-out infinite 1.2s}
@keyframes wobble{50%{transform:rotate(-8deg) scale(1.06)}}
.stage{position:absolute;left:50%;bottom:0;width:min(440px,70%);height:62%;transform:translateX(-50%)}
.stage .produce{position:absolute;font-size:clamp(3rem,7vw,5.5rem);transition:transform .15s ease-out;filter:drop-shadow(0 10px 12px rgba(0,0,0,.25))}
.stage .bag{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:62%;height:70%;background:linear-gradient(#d9b98c,#b8905f);border-radius:14px 14px 4px 4px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.08)}
.stage .bag::before{content:"FreshMart";position:absolute;inset:auto 0 22% 0;text-align:center;font-family:var(--display);font-weight:800;color:var(--forest);font-size:1.4rem}
.copy{position:absolute;left:32px;bottom:34px;max-width:270px;font-size:.98rem;line-height:1.5;opacity:0;animation:fade .8s 1.1s forwards}
.copy b{display:block;font-size:1.05rem;margin-bottom:4px}
@keyframes fade{to{opacity:1}}

/* KPI section */
.kpis{max-width:1200px;margin:48px auto 24px}
.kpis > h2{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.02em;margin-bottom:6px}
.kpis > p{color:var(--muted);margin-bottom:22px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.panel{--c:var(--forest);display:flex;flex-direction:column;background:var(--white);border-radius:26px;padding:22px;box-shadow:0 0 0 1px #dfe7e0;transition:transform .25s,box-shadow .25s}
.panel:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(20,87,58,.15)}
.panel.cost{--c:var(--cost)}
.panel h3{font-family:var(--display);font-size:1.3rem;display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.main{margin:16px 0 4px}
.main small,.mini small{color:var(--muted);font-size:.85rem}
.main strong{display:block;font-family:var(--display);font-size:2.6rem;letter-spacing:-.02em;color:var(--c);line-height:1.1}
.spark{width:100%;height:70px;margin:6px 0 12px;overflow:visible}
.spark path.line{fill:none;stroke:var(--c);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.spark path.area{fill:var(--c);opacity:.12}
.panel.in .spark path.line{animation:draw 1.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spark circle{fill:var(--white);stroke:var(--c);stroke-width:2.5;opacity:0;transition:opacity .15s}
.spark circle.on{opacity:1}
.tip{height:1.2em;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.mini{background:var(--paper);border-radius:14px;padding:10px 12px;transition:background .2s,transform .2s}
.mini:hover{background:var(--mint);transform:scale(1.03)}
.mini strong{display:block;font-size:1.15rem;margin-top:2px}
.open{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:var(--deep);color:#fff;padding:7px 7px 7px 18px;border-radius:99px;font-weight:700;transition:background .2s}
.open i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--deep);font-style:normal;transition:transform .3s}
.open:hover{background:#000}.open:hover i{transform:translateX(4px)}

@media (max-width:760px){
  .hero{min-height:560px}.badge{left:auto;right:6%;top:17%}
  .copy{left:20px;right:20px;max-width:none;bottom:auto;top:44%}
  .stage{height:40%}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>

<div class="top"><a class="logo" href="index.html">FreshMart</a></div>

<nav class="menu">
  <div class="group">
    <a href="index.html" class="active">Home</a>
    <a href="sales.html">Sales Analysis</a>
    <a href="profit.html">Profit Analysis</a>
    <a href="cost.html">Cost Analysis</a>
  </div>
</nav>

<section class="hero" id="hero">
  <h1 id="title" aria-label="FreshMart"></h1>
  <div class="badge">Same-Day Delivery</div>
  <div class="stage">
    <div class="bag"></div>
    <span class="produce" data-d="14" style="left:6%;bottom:46%">🥬</span>
    <span class="produce" data-d="-10" style="left:28%;bottom:58%">🥕</span>
    <span class="produce" data-d="18" style="left:50%;bottom:64%">🍅</span>
    <span class="produce" data-d="-16" style="right:22%;bottom:56%">🥖</span>
    <span class="produce" data-d="10" style="right:4%;bottom:44%">🍊</span>
  </div>
  <div class="copy"><b>Fresh Produce | Best Deals</b>Your sales, profit, and costs for January to June, all in one place.</div>
</section>

<section class="kpis" aria-labelledby="kpiTitle">
  <h2 id="kpiTitle">Key Numbers</h2>
  <p>January to June. Hover over a chart to see each month.</p>
  <div class="cols" id="cols"></div>
</section>

<script>
const months = ['Jan','Feb','Mar','Apr','May','Jun'];
const sales  = [12000,15000,18000,22000,20000,25000];
const profit = [4000,6000,8000,10000,9500,12000];
const cost   = [8000,9000,10000,12000,11000,13000];
const sum = a => a.reduce((x,y) => x+y, 0);
const best = a => a.indexOf(Math.max(...a));
const usd = n => '$' + Math.round(n).toLocaleString();
const pct = n => n.toFixed(1) + '%';
const growth = a => '+' + Math.round((a[a.length-1]/a[0]-1)*100) + '%';

/* each KPI: value is a number (animated) with a formatter, or plain text */
const panels = [
  { cls:'', title:'Sales', link:'sales.html', series:sales, label:'Total sales',
    value:sum(sales), fmt:usd, unit:'Monthly Sales',
    minis:[
      ['Best month', months[best(sales)] + ' · ' + usd(Math.max(...sales))],
      ['Growth, Jan to Jun', growth(sales)],
      ['Top category', 'Produce · 50%'],
      ['Top region', 'North · 40%']
    ]},
  { cls:'', title:'Profit', link:'profit.html', series:profit, label:'Total profit',
    value:sum(profit), fmt:usd, unit:'Monthly Profit',
    minis:[
      ['Best month', months[best(profit)] + ' · ' + usd(Math.max(...profit))],
      ['Growth, Jan to Jun', growth(profit)],
      ['Profit margin', pct(sum(profit)/sum(sales)*100)],
      ['Monthly average', usd(sum(profit)/6)]
    ]},
  { cls:'cost', title:'Cost', link:'cost.html', series:cost, label:'Total costs',
    value:sum(cost), fmt:usd, unit:'Monthly Costs',
    minis:[
      ['Highest month', months[best(cost)] + ' · ' + usd(Math.max(...cost))],
      ['Growth, Jan to Jun', growth(cost)],
      ['Share of sales', pct(sum(cost)/sum(sales)*100)],
      ['Monthly average', usd(sum(cost)/6)]
    ]}
];

/* sparkline path from a series */
function spark(s){
  const w=300,h=70,pad=6,max=Math.max(...s),min=Math.min(...s)*0.8;
  const pts = s.map((v,i) => [pad + i*(w-2*pad)/(s.length-1), h-pad - (v-min)/(max-min)*(h-2*pad)]);
  const line = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1][0]} ${h} L${pts[0][0]} ${h} Z`;
  return {pts,line,area,w,h};
}

const cols = document.getElementById('cols');
panels.forEach(p => {
  const sp = spark(p.series);
  const el = document.createElement('article');
  el.className = 'panel ' + p.cls;
  el.innerHTML = `
    <h3>${p.title}</h3>
    <div class="main"><small>${p.label}</small><strong data-val="${p.value}">${p.fmt(0)}</strong></div>
    <svg class="spark" viewBox="0 0 ${sp.w} ${sp.h}" preserveAspectRatio="none" role="img" aria-label="${p.unit} trend">
      <path class="area" d="${sp.area}"/>
      <path class="line" d="${sp.line}" pathLength="1"/>
      ${sp.pts.map(pt => `<circle cx="${pt[0]}" cy="${pt[1]}" r="5"/>`).join('')}
    </svg>
    <div class="tip">${p.unit}: hover to see each month</div>
    <div class="minis">${p.minis.map(m => `<div class="mini"><small>${m[0]}</small><strong>${m[1]}</strong></div>`).join('')}</div>
    <a class="open" href="${p.link}">Open ${p.title} Analysis <i>›</i></a>`;
  cols.appendChild(el);

  /* hover: highlight the nearest month */
  const svg = el.querySelector('svg'), dots = svg.querySelectorAll('circle'), tip = el.querySelector('.tip');
  svg.addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(5, Math.round((e.clientX - r.left)/r.width*5)));
    dots.forEach((d,k) => d.classList.toggle('on', k===i));
    tip.textContent = `${months[i]}: ${usd(p.series[i])}`;
  });
  svg.addEventListener('mouseleave', () => {
    dots.forEach(d => d.classList.remove('on'));
    tip.textContent = `${p.unit}: hover to see each month`;
  });
});

/* count up + draw line when a panel scrolls into view */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const io = new IntersectionObserver(entries => entries.forEach(en => {
  if(!en.isIntersecting) return;
  io.unobserve(en.target);
  en.target.classList.add('in');
  const num = en.target.querySelector('[data-val]'), idx = [...cols.children].indexOf(en.target);
  const target = +num.dataset.val, fmt = panels[idx].fmt, t0 = performance.now(), dur = reduce ? 1 : 1200;
  (function tick(now){
    const k = Math.min(1, (now-t0)/dur), ease = 1-Math.pow(1-k,3);
    num.textContent = fmt(target*ease);
    if(k<1) requestAnimationFrame(tick);
  })(t0);
}), {threshold:.35});
[...cols.children].forEach(c => io.observe(c));

/* hero title: letters rise one by one */
document.getElementById('title').innerHTML = [...'FreshMart'].map((ch,i) => `<span style="--i:${i}" aria-hidden="true">${ch}</span>`).join('');

/* parallax produce */
const hero = document.getElementById('hero');
hero.addEventListener('mousemove', e => {
  const r = hero.getBoundingClientRect();
  const x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5;
  hero.querySelectorAll('.produce').forEach(el => {
    const d = +el.dataset.d;
    el.style.transform = `translate(${x*d*2.2}px,${y*d*2.2}px) rotate(${x*d}deg)`;
  });
});
hero.addEventListener('mouseleave', () => hero.querySelectorAll('.produce').forEach(el => el.style.transform = ''));
</script>
</body>
</html>
